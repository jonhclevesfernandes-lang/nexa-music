<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Nexa Music — sua música, suas playlists, seu ritmo." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Nexa Music</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar" aria-label="Navegação principal">
      <button class="brand" data-view="home" aria-label="Ir para início">
        <span class="brand-mark">N</span><span>Nexa</span>
      </button>
      <nav class="primary-nav">
        <button class="nav-item active" data-view="home"><span>⌂</span> Início</button>
        <button class="nav-item" data-view="search"><span>⌕</span> Buscar</button>
        <button class="nav-item" data-view="library"><span>♫</span> Sua biblioteca</button>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-heading"><span>Playlists</span><button id="newPlaylistBtn" title="Nova playlist">＋</button></div>
        <div id="playlistNav" class="playlist-nav"></div>
      </div>
      <div class="sidebar-footer">
        <button id="installBtn" class="install-btn" hidden>↧ Instalar app</button>
        <span class="tiny">Nexa Music • PWA</span>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="history-actions">
          <button id="backBtn" class="icon-btn" title="Voltar">‹</button>
          <button id="forwardBtn" class="icon-btn" title="Avançar">›</button>
        </div>
        <div class="topbar-actions">
          <button id="queueBtn" class="pill secondary">Fila <span id="queueCount">0</span></button>
          <button id="profileBtn" class="profile-pill"><span id="avatarInitial">L</span><span id="profileName">Visitante</span></button>
        </div>
      </header>
      <section id="content" class="content" tabindex="-1"></section>
    </main>

    <section class="player" id="player" aria-label="Reprodutor">
      <div class="now-playing">
        <img id="playerCover" src="assets/covers/aurora.svg" alt="Capa" />
        <div class="now-meta">
          <strong id="playerTitle">Escolha uma música</strong>
          <span id="playerArtist">Nexa Music</span>
        </div>
        <button id="favoriteBtn" class="heart-btn" title="Curtir">♡</button>
      </div>
      <div class="player-center">
        <div class="transport">
          <button id="shuffleBtn" class="transport-btn" title="Aleatório">⤨</button>
          <button id="prevBtn" class="transport-btn" title="Anterior">◀</button>
          <button id="playBtn" class="play-btn" title="Reproduzir">▶</button>
          <button id="nextBtn" class="transport-btn" title="Próxima">▶|</button>
          <button id="repeatBtn" class="transport-btn" title="Repetir">↻</button>
        </div>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso da música" />
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <button id="miniQueueBtn" class="transport-btn" title="Abrir fila">≡</button>
        <span class="volume-icon">◖</span>
        <input id="volume" type="range" min="0" max="1" value="0.75" step="0.01" aria-label="Volume" />
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <nav class="mobile-nav" aria-label="Navegação móvel">
      <button class="mobile-nav-item active" data-view="home"><span>⌂</span><small>Início</small></button>
      <button class="mobile-nav-item" data-view="search"><span>⌕</span><small>Buscar</small></button>
      <button class="mobile-nav-item" data-view="library"><span>♫</span><small>Biblioteca</small></button>
    </nav>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
